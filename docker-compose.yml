services:
  
  gateway:
    container_name: ticketing-microservices-gateway
    image: rajsekhar05/ticketing-ms-gateway:latest
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    networks:
      - ticketing-network
  
  user:
    container_name: ticketing-microservices-user
    image: rajsekhar05/ticketing-ms-user:latest
    build:
      context: .
      dockerfile: user/Dockerfile
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticketing-network
  
  event:
    container_name: ticketing-microservices-event
    image: rajsekhar05/ticketing-ms-event:latest
    build:
      context: .
      dockerfile: event/Dockerfile
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticketing-network
  
  booking:
    container_name: ticketing-microservices-booking
    image: rajsekhar05/ticketing-ms-booking:latest
    build:
      context: .
      dockerfile: booking/Dockerfile
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticketing-network
  
  payment:
    container_name: ticketing-microservices-payment
    image: rajsekhar05/ticketing-ms-payment:latest
    build:
      context: .
      dockerfile: payment/Dockerfile
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticketing-network
  
  notification:
    container_name: ticketing-microservices-notification
    image: rajsekhar05/ticketing-ms-notification:latest
    build:
      context: .
      dockerfile: notification/Dockerfile
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticketing-network
  
  postgres:
    container_name: ticketing-microservices-postgres
    image: postgres:15-alpine
    env_file:
      - .env.docker
    volumes:
      # Postgres automatically runs all .sql, .sh scripts in this location on start up
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d user_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - ticketing-network

networks:
  ticketing-network:
    driver: bridge
# Run: docker compose up -d
# Stop: docker compose down -v  (Removes all containers & volumes)
