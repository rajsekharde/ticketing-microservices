syntax = "proto3";

package event;

option go_package = "github.com/rajsekharde/ticketing-microservices/proto/event;eventpb";

import "google/protobuf/timestamp.proto";
// import "google/protobuf/duration.proto";


// Health endpoint

message GetHealthRequest {}

message GetHealthResponse {
  string status = 1;
  string db_status = 2;
  string msg = 3;
}

// Create venue

message CreateVenueRequest {
  string name     = 1;
  string address  = 2;
  int64  capacity = 3;
}

message CreateVenueResponse {
  int64 venue_id = 1;
}

// Create event

message CreateEventRequest {
  string                    name             = 1;
  int64                     venue_id         = 2;
  google.protobuf.Timestamp start_time       = 3;
  int64                     duration_minutes = 4;
  int64                     ticket_price     = 5;
}

message CreateEventResponse {
  int64 event_id = 1;
}

// Get events

message Event {
  int64 id = 1;
  string name = 2;
  string venue_name = 3;
  string venue_address = 4;
  google.protobuf.Timestamp start_time = 5;
  int64 duration_minutes = 6;
  int64 ticket_price = 7;
}

message GetEventsRequest {}

message GetEventsResponse {
  repeated Event events = 1;
}

// Get event seats

message Seat {
  int64 id = 1;
  int64 event_id = 2;
  int64 seat_id = 3;
  string status = 4;
  int64 price = 5;
}
message GetEventSeatsRequest {
  int64 event_id = 1;
}

message GetEventSeatsResponse {
  repeated Seat seats = 1;
}

// Get venues

message Venue {
  int64 id = 1;
  string name = 2;
  string address = 3;
  int64 capacity = 4;
}

message GetVenuesRequest {}

message GetVenuesResponse {
  repeated Venue venues = 1;
}

// Lock event seat

message LockSeatRequest {
  int64 event_seat_id = 1;
  int64 booking_id = 2;
}

message LockSeatResponse {}

// Book event seat

message BookSeatRequest {
  int64 event_seat_id = 1;
  int64 booking_id = 2;
}

message BookSeatResponse {}

// Release event seat

message ReleaseSeatRequest {
  int64 event_seat_id = 1;
  int64 booking_id = 2;
}

message ReleaseSeatResponse {}

service EventService {
  rpc GetHealth (GetHealthRequest) returns (GetHealthResponse);
  rpc CreateVenue (CreateVenueRequest) returns (CreateVenueResponse);
  rpc CreateEvent (CreateEventRequest) returns (CreateEventResponse);
  rpc GetEvents (GetEventsRequest) returns (GetEventsResponse);
  rpc GetEventSeats (GetEventSeatsRequest) returns (GetEventSeatsResponse);
  rpc GetVenues (GetVenuesRequest) returns (GetVenuesResponse);
  rpc LockSeat(LockSeatRequest) returns (LockSeatResponse);
  rpc BookSeat(BookSeatRequest) returns (BookSeatResponse);
  rpc ReleaseSeat(ReleaseSeatRequest) returns (ReleaseSeatResponse);
}