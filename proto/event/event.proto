syntax = "proto3";

package event;

option go_package = "github.com/rajsekharde/ticketing-microservices/proto/event;eventpb";

import "google/protobuf/timestamp.proto";
// import "google/protobuf/duration.proto";

message GetHealthRequest {}

message GetHealthResponse {
  string status = 1;
  string db_status = 2;
  string msg = 3;
}

message CreateVenueRequest {
  string name     = 1;
  string address  = 2;
  int64  capacity = 3;
}

message CreateVenueResponse {
  int64 venue_id = 1;
}

message CreateEventRequest {
  string                    name             = 1;
  int64                     venue_id         = 2;
  google.protobuf.Timestamp start_time       = 3;
  int64                     duration_minutes = 4;
  int64                     ticket_price     = 5;
}

message CreateEventResponse {
  int64 event_id = 1;
}

message Event {
  int64 id = 1;
  string name = 2;
  string venue_name = 3;
  string venue_address = 4;
  google.protobuf.Timestamp start_time = 5;
  int64 duration_minutes = 6;
  int64 ticket_price = 7;
}

message GetEventsRequest {}

message GetEventsResponse {
  repeated Event events = 1;
}

message Seat {
  int64 id = 1;
  int64 event_id = 2;
  int64 seat_id = 3;
  string status = 4;
  int64 price = 5;
}
message GetEventSeatsRequest {
  int64 event_id = 1;
}

message GetEventSeatsResponse {
  repeated Seat seats = 1;
}

service EventService {
  rpc GetHealth (GetHealthRequest) returns (GetHealthResponse);
  rpc CreateVenue (CreateVenueRequest) returns (CreateVenueResponse);
  rpc CreateEvent (CreateEventRequest) returns (CreateEventResponse);
  rpc GetEvents (GetEventsRequest) returns (GetEventsResponse);
  rpc GetEventSeats (GetEventSeatsRequest) returns (GetEventSeatsResponse);
}