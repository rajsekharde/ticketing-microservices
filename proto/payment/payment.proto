syntax = "proto3";

package payment;

option go_package = "github.com/rajsekharde/ticketing-microservices/proto/payment;paymentpb";

// Health endpoint

message GetHealthRequest {}

message GetHealthResponse {
  string status = 1;
  string db_status = 2;
  string msg = 3;
}

// Complete payment
message CompletePaymentRequest {
  int64 booking_id = 1;
  int64 amount = 2;
}

message CompletePaymentResponse {
  int64 transaction_id = 1;
}

service PaymentService {
  rpc GetHealth (GetHealthRequest) returns (GetHealthResponse);
  rpc CompletePayment (CompletePaymentRequest) returns (CompletePaymentResponse);
}